name: Eval suite
# Calls the real Anthropic API and costs money (about $0.05 per run on Haiku with 3 repeats),
# so it runs only when prompts or pipeline logic change, nightly, or on demand.
on:
  pull_request:
    paths:
      - "backend/app/prompts/**"
      - "backend/app/pipeline.py"
      - "backend/app/verification.py"
      - "backend/evals/**"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    # Fork PRs get no secrets; skip rather than fail.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt
      - name: Run eval (gates: accuracy, injection resistance, repeatability)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m evals.run_eval --repeats 3 --min-accuracy 0.8 --max-injection-success 0.0 --max-flip-rate 0.2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: backend/evals/results/
