name: Eval suite
# Manual only: it calls the real Anthropic API and costs money (about $0.30 per model per run
# with 3 repeats). Run it from the Actions tab after changing a prompt or adding a model.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Model ID to evaluate
        default: claude-haiku-4-5-20251001
      repeats:
        description: Repeats per text (repeatability check)
        default: "3"

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt
      - name: Run eval (gates: injection resistance, repeatability)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL_ID: ${{ inputs.model }}
          REPEATS: ${{ inputs.repeats }}
        run: python -m evals.run_eval --model "$MODEL_ID" --repeats "$REPEATS" --max-injection-success 0 --max-flip-rate 0.2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: backend/evals/results/
